spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:banklink}
spring.datasource.username=${DB_USER:banklink}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

app.seed-demo-users=false
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost}
privite_key=${JWT_SECRET}
